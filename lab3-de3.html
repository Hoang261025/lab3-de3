
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fire Alarm Dashboard</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #101827;
    color: white;
    margin: 0;
    padding: 25px;
}

h1 {
    text-align: center;
    color: #38bdf8;
}

.status {
    text-align: center;
    margin: 20px;
    color: #facc15;
}

.container {
    max-width: 1000px;
    margin: auto;
}

.cards, .charts, .controls {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    margin-bottom: 25px;
}

.card, .chart, .control {
    background: #1e293b;
    padding: 22px;
    border-radius: 12px;
    text-align: center;
}

.card h3 {
    color: #94a3b8;
}

.value {
    font-size: 38px;
    font-weight: bold;
    color: #38bdf8;
}

button {
    padding: 12px 20px;
    margin: 5px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

.on {
    background: #22c55e;
    color: white;
}

.off {
    background: #ef4444;
    color: white;
}

.auto {
    background: #64748b;
    color: white;
}

@media(max-width: 650px) {
    .cards, .charts, .controls {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<h1>FIRE ALARM MONITORING SYSTEM</h1>

<div class="status" id="status">
    MQTT: Đang kết nối...
</div>

<div class="container">

    <!-- DATA CARDS -->
    <div class="cards">

        <div class="card">
            <h3>Nồng độ khí Gas / Khói</h3>
            <div class="value" id="gas">0</div>
            <p>ADC (0 - 4095)</p>
        </div>

        <div class="card">
            <h3>Nhiệt độ</h3>
            <div class="value" id="temp">0 °C</div>
            <p>Temperature</p>
        </div>

    </div>

    <!-- CHARTS -->
    <div class="charts">

        <div class="chart">
            <h3>Biểu đồ khí Gas</h3>
            <canvas id="gasChart"></canvas>
        </div>

        <div class="chart">
            <h3>Biểu đồ nhiệt độ</h3>
            <canvas id="tempChart"></canvas>
        </div>

    </div>

    <!-- ACTUATOR CONTROL -->
    <div class="controls">

        <div class="control">
            <h3>Điều khiển Quạt</h3>

            <button class="on"
                onclick="sendCommand('fan','ON')">
                BẬT QUẠT
            </button>

            <button class="off"
                onclick="sendCommand('fan','OFF')">
                TẮT QUẠT
            </button>

            <button class="auto"
                onclick="sendCommand('fan','AUTO')">
                AUTO
            </button>

            <p id="fanStatus">Chưa có lệnh</p>
        </div>

        <div class="control">
            <h3>Điều khiển Máy bơm</h3>

            <button class="on"
                onclick="sendCommand('pump','ON')">
                BẬT BƠM
            </button>

            <button class="off"
                onclick="sendCommand('pump','OFF')">
                TẮT BƠM
            </button>

            <button class="auto"
                onclick="sendCommand('pump','AUTO')">
                AUTO
            </button>

            <p id="pumpStatus">Chưa có lệnh</p>
        </div>

    </div>
</div>

<script>

// MQTT CONFIGURATION
const broker = "wss://broker.emqx.io:8084/mqtt";

const client = mqtt.connect(broker);

const sensorTopic = "hoang/fire/sensor";

const fanTopic = "hoang/fire/cmd/fan";
const pumpTopic = "hoang/fire/cmd/pump";

// MQTT CONNECT
client.on("connect", function() {

    document.getElementById("status").innerText =
        "MQTT: Đã kết nối";

    client.subscribe(sensorTopic);

});

client.on("error", function(error) {
    document.getElementById("status").innerText =
        "MQTT: Lỗi kết nối";
});

// CHART CONFIGURATION
function createChart(id, label) {

    return new Chart(document.getElementById(id), {

        type: "line",

        data: {
            labels: [],
            datasets: [{
                label: label,
                data: [],
                borderWidth: 2,
                tension: 0.3
            }]
        },

        options: {
            responsive: true,

            scales: {
                x: {
                    ticks: { color: "white" }
                },

                y: {
                    ticks: { color: "white" }
                }
            },

            plugins: {
                legend: {
                    labels: { color: "white" }
                }
            }
        }
    });
}

const gasChart = createChart("gasChart", "Gas ADC");
const tempChart = createChart("tempChart", "Temperature");

// UPDATE CHART
function updateChart(chart, value) {

    let time = new Date().toLocaleTimeString();

    chart.data.labels.push(time);
    chart.data.datasets[0].data.push(value);

    // Chỉ giữ 20 điểm dữ liệu gần nhất
    if (chart.data.labels.length > 20) {
        chart.data.labels.shift();
        chart.data.datasets[0].data.shift();
    }

    chart.update();
}

// RECEIVE MQTT DATA
client.on("message", function(topic, message) {

    if (topic !== sensorTopic) return;

    try {

        const data = JSON.parse(message.toString());

        document.getElementById("gas").innerText =
            data.gas;

        document.getElementById("temp").innerText =
            data.temp + " °C";

        updateChart(gasChart, data.gas);
        updateChart(tempChart, data.temp);

    } catch(error) {
        console.log("Invalid MQTT data", error);
    }
});

// SEND COMMAND
function sendCommand(device, command) {

    let topic = device === "fan" ?
        fanTopic : pumpTopic;

    if (client.connected) {

        client.publish(topic, command);

        document.getElementById(
            device + "Status"
        ).innerText = "Đã gửi lệnh: " + command;

    } else {

        alert("MQTT chưa kết nối!");

    }
}

</script>

</body>
</html>
